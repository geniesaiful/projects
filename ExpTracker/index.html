<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="contLeft">
    <div class="titleDiv">
        <div> Image</div>
        <div class="titleName"> <span>Title</span><span>Name</span></div>
    </div>
    
    <div class="navDiv">
        <a href="#" onclick="showRigtContent('overviewDiv')">Overview</a>
        <a href="#" onclick="showRigtContent('transactionsDiv')">Transactions</a>
        <a href="#" onclick="showRigtContent('catagoriesDiv')">Catagories</a>
        <a href="#" onclick="showRigtContent('reportsDiv')">Reports</a>
        <a href="#" onclick="showRigtContent('settingsDiv')">Settigs</a>
    </div>
    <div class="statusAreaDiv">
        <span>Monthly overview</span>
        <span>Date</span>
    </div>
</div>

<div class="contRight">
    <div class="greetingDiv">
        <span>Good Morning!!</span><span>Name</span><span style= "color: blue; flex-grow: 1;">IMG</span><span>Dark Mode</span>
    </div>
    <div class="statusCardContainer">
    
        <div class="statusCard">
                Total Balance
        </div>
    
        <div class="statusCard">
                Total Income
        </div>
    
        <div class="statusCard">
                Total Expense
        </div>
    
        <div class="statusCard">
                Saving Rate
        </div>
    
    </div>

    <div class="contentDiv" id="overviewDiv">
        <div>
            Bar1
        </div>
        <div>
            Bar2
        </div>
        <div>
            Table area
        </div>
    </div>

    <div class="contentDiv activeDiv" id="transactionsDiv">
        <div>
            Transaction Overview
        </div>
        <br><br><br> 
        <div id="addTransactionDiv">
            <form id="transactionForm">
                <label for="type">Type:</label>
                <select id="type" name="type" required>
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>
            </form>
            <br><br>

            <label for="title">Title:</label>
            <input type="text" id="title" name="title" placeholder="e.g., Grocery Shopping" required>

            <br><br>

            <label for="amount">Amount:</label>
            <input type="number" id="amount" name="amount" step="0.01" min="0" placeholder="0.00" required>

            <br><br>

            <label for="catDropdown">Category:</label>
            <select id="catDropdown" name="category" required>
                <option value="" disabled selected>Select a category</option>
                <!-- <option value="food">Food & Dining</option>
                <option value="rent">Rent & Bills</option>
                <option value="shopping">Shopping</option>
                <option value="salary">Salary</option>
                <option value="entertainment">Entertainment</option>
                <option value="other">Other</option> -->
            </select>

            <br><br>

            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required>

            <br><br>

            <button type="submit">Add Transaction</button>
            </form>    
        </div>

    </div>
    <div class="contentDiv" id="catagoriesDiv">
        <div id="catInpDiv">
            <input type="text" id="catName" placeholder="Category Name (e.g. Salary, Groceries)">

            <select id="catType">
                <option value="expense">Expense</option>
                <option value="income">Income</option>
            </select>

            <button id="addCatBtn" onclick="addCategory()">Add</button>
        </div>
        
        <br><br><br>
        
        <div>
            <h3>All Categories</h3>
            <table>
                <thead>
                <tr>
                    <th>Category</th>
                    <th>Type</th>
                </tr>
                </thead>
                <tbody id="catTableBody">
                <!-- Saved categories will appear here -->
                </tbody>
            </table>

        </div>
    </div>
    <div class="contentDiv" id="reportsDiv">
        Show Reports
    </div>
    <div class="contentDiv" id="settingsDiv">
        Dark Mode
    </div>
</div>
<script src="scripts.js"></script>
</body>
</html>
