<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies Application</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
    <aside class="leftMenuBar">
        <header class="appTitleArea" style="display: flex; flex-direction: row;">
            <img src="resources/icons8-movie-94.png" style="width: 3rem; height: 3rem; margin-right: .5rem;">
            <div style="display: flex; flex-direction: column;">
                <h1 class="btrh1">Movie Search</h1>
                <span class="btrh2Lt">Search your favourite movie</span>
            </div>
        </header>
        <div class="menuDiv">
            <nav class="sidebarMenu" aria-label="Main Navigation">
                <button type="button" class="menuItem active" id="menuItemHomeID" data-target="contentHomeID">
                    <span class="icon">🏠</span>
                    <span class="label">Home</span>
                </button>
                <button type="button" class="menuItem" id="menuItemPopularID" data-target="contentPopularID">
                    <span class="icon">⭐</span>
                    <span class="label">Popular</span>
                </button>
                <button type="button" class="menuItem" id="menuItemTopRatedID" data-target="contentTopRatedID">
                    <span class="icon">🏆</span>
                    <span class="label">Top Rated</span>
                </button>
                <button type="button" class="menuItem" id="menuItemNowPlayingID" data-target="contentNowPlayingID">
                    <span class="icon">▶️</span>
                    <span class="label">Now Playing</span>
                </button>
                <button type="button" class="menuItem" id="menuItemUpcomingID" data-target="contentUpcomingID">
                    <span class="icon">📅</span>
                    <span class="label">Upcoming</span>
                </button>
                <button type="button" class="menuItem" id="menuItemGenresID" data-target="contentGenresID">
                    <span class="icon">🧩</span>
                    <span class="label">Genres</span>
                </button>
                
                <button type="button" class="menuItem" id="menuItemWatchlistID" data-target="contentWatchlistDivID">
                    <span class="icon">🔖</span>
                    <span class="label">Watchlist</span>
                    <span class="count" id="menuWatchlistNumber">12</span>
                </button>
            </nav>
        </div>
        <section class="recentSearches" id="recentSearchesID">
            <span class="smallerHeading">🕒 Recent Searches</span>
            <ul id="recentSearchesList" class="recentSearchesListID">
                <li class="recentSearchesCard">Inception</li>
                <li class="recentSearchesCard">The Dark Knight</li>
                <li class="recentSearchesCard">Interstellar</li>
                <li class="recentSearchesCard">Avengers</li>
                <li class="recentSearchesCard">Spider-Man</li>
            </ul>
        </section>
        <footer class="sidebarFooter">
            <div class="themeToggle" id="themeToggleID">
                <span class="smallTxt">Dark Mode</span>
                <label class="toggleSwitchContainer">
                    <input type="checkbox" id="toggleSwitchID" checked>
                    <span class="toggleSwithSlider"></span>
                </label>
            </div>
        </footer>
    </aside>


    <main>
        

        
    </main>






<script src="scripts.js"></script>
</body>
