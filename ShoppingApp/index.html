<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopCart Application</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class = "normalTxt">
    <header class="siteHeader">
        <a href="" class="siteLogo">
            <img src="resources/cart.svg" alt="App Logo" style="width: 3.5rem; height: 3.5rem;padding:0.3rem">
            <span class="appNameTxt btrh1">ShopCart<span class="btrh2Lt">Shop with ease</span></span>

        </a>
        <nav>
            <ul>
                <li data-target="contentHomeId" class="active">Home</li>
                <li data-target="contentAdminId">Admin</li>
                <li data-target="contentAboutId">About</li>
            </ul>
        </nav>
        <div class="cartButtonArea">
            <img src="resources/shopping-basket.svg"  data-target="contentCartId" >
            <span class="cart-badge normalTxtBold" id="cartCount"></span>
        </div>

    </header>

    <main class="contents">
        <section class="content active" id="contentHomeId">
            <div class="homeArea" id="homeAreaId">
                <aside class="leftPanel" id="leftPanelId">
                    <div class="lpCategoryList" id="lpCategoryListId">
                        <div class="searchSection" style="margin-bottom: 1rem;">
                            <input 
                                type="text" 
                                id="searchInput" 
                                placeholder="Search items..." 
                                style="width: 100%; padding: 0.4rem; border: 1px solid #00000033; border-radius: 0.3rem;"
                            >
                        </div>
                        
                        <p class="normalTxtBold">Categories</p>
                        <nav>
                            <ul>
                                <li data-target="itemAllId" class="menuListItem active">All<span class="mlItemCount" id="mlicAllId">0</span></li>
                                
                            </ul>
                        </nav>
                    </div>
                    <div class="priceFilterSection" style="margin-top: 2rem;">
                        <p class="normalTxtBold">Price Range</p>
                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            <input type="range" id="priceSlider" min="0" max="100" value="100" step="1" style="width: 100%;">
                            <span class="normalTxt" id="priceValueText">$0 - $0</span>
                        </div>
                    </div>


                </aside>
                <div class="itemArea" id="itemAreaId">
                    <section class="itemContainer active" id="itemAllId">
                        All Items
                    </section>
                </div>

            </div>
        </section>
        <section class="content" id="contentAdminId">
            <div class="adminLayout">
                <!-- Left Side: Add Category & Add Item Forms -->
                <div class="adminLeftSection">
                    <form id="addCategoryForm" class="adminForm">
                        <h2 class="btrh2">Add Category</h2>
                        <div class="formGroup">
                            <label for="catName">Category Name:</label>
                            <input type="text" id="catName" required>
                        </div>
                        <button class="univSubmitBtn" type="submit">Add Category</button>
                    </form>

                    <hr>

                    <form id="addItemForm" class="adminForm">
                        <h2 class="btrh2">Add Item</h2>
                        <div class="formGroup">
                            <label for="itemTitle">Item Title:</label>
                            <input type="text" id="itemTitle" required>
                        </div>
                        
                        <div class="formGroup">
                            <label for="itemCategory">Item Category:</label>
                            <select id="itemCategory" required>
                                <option value="">Select Category</option>
                            </select>
                        </div>

                        <div class="formGroup">
                            <label for="itemDesc">Short Description (max 80 chars):</label>
                            <textarea id="itemDesc" rows="2" maxlength="80" required></textarea>
                        </div>

                        <div class="formGroup">
                            <label for="itemPrice">Item Price:</label>
                            <input type="number" id="itemPrice" step="0.01" required>
                        </div>

                        <div class="formGroup">
                            <label for="itemPhoto">Item Photo Path:</label>
                            <input type="text" id="itemPhoto" placeholder="resources/item.jpg" required>
                        </div>

                        <div class="formGroup">
                            <label for="itemExtra">Extra Info (max 20 chars):</label>
                            <input type="text" id="itemExtra" maxlength="20" required>
                        </div>

                        <div class="buttonGroup">
                            <button class="univSubmitBtn" type="submit">Submit</button>
                            <button class="univCancelBtn" type="reset">Clear</button>
                        </div>
                    </form>
                </div>

                <!-- Right Side: Orders Section -->
                <div class="adminRightSection" id="adminOrdersSection">
                    <!-- Rendered dynamically via JavaScript -->
                </div>
            </div>
        </section>
        <section class="content" id="contentAboutId">
            About
        </section>
        <section class="content" id="contentCartId">
            <div class="cartContainer" id="cartContainerId">
            </div>
        </section>
        <section class="content" id="contentCheckoutId">
            <div class="checkoutContainer" id="checkoutContainerId">
            </div>
        </section>
    </main>











    <script src="scripts.js"></script>
</body>
