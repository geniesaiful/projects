<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes Application</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="leftBar">
        <div class="titleDiv">
            <img src="resources/note-book.png" style="width: 3rem; height: 3rem;">
            <div style="display: flex;flex-direction: column;"><span class="editorial-title">Notes Application</span>
            <span class="editorial-subtitle">Your Daily Notes</span></div>
        </div>
        <div style="display: flex;">
            <button class="buttonWide" id="sidebarAddNoteBtn" data-target="addNoteDivID"> + Add Notes </button>
        </div>
        <div class="menuDiv">
            <nav class="sidebar-menu">
                <button class="menu-item active" id="contentAllMenuID" data-target="contentAllID">
                    <span class="icon">🏠</span>
                    <span class="label">Home</span>
                    <span class="count" id="menuAllNumber">24</span>
                </button>

                <button class="menu-item" id="pinnedMenuID" data-target="pinnedDivID">
                    <span class="icon">📌</span>
                    <span class="label">Pinned</span>
                    <span class="count" id="menuPinnedNumber">5</span>
                </button>

                <button class="menu-item" id="categoriesMenuID" data-target="categoriesDivID">
                    <span class="icon">📁</span>
                    <span class="label">Categories</span>
                </button>
                
                <button class="menu-item" id="tagsMenuID" data-target="tagsDivID">
                    <span class="icon">🏷️</span>
                    <span class="label">Tags</span>
                </button>
                
                <button class="menu-item" id="trashMenuID" data-target="trashDivID">
                    <span class="icon">🗑️</span>
                    <span class="label">Trash</span>
                    <span class="count" id="menuDeltedNumber">5</span>
                </button>

                <button class="menu-item" id="themeMenuID" data-target="themeDivID">
                    <span class="icon">☾</span>
                    <span class="label">Theme</span>
                </button>
            </nav>
        </div>
        <div class="noteCount">
            <div><span class="icon">📀</span><span class="smallerTxt">Notes Storage</span></div>
            <div class="progressBar"><div class="progress" id="progress"></div></div>
            <div><span class="tagTxt" id="statusTotalNotesID">0/100 notes used</span></div>

        </div>
    </div>
    <div class="contents">
        <div class="contentTop">
            <input type="search" class="search-input" id="search-input" placeholder="Search in Title, Note and Tags">
            <!-- <button class="search-btn" id="search-btn">Search</button> -->
        </div>
        <div class="content active" id="contentAllID">
            <div class="notesOperation" >
                <div class="notesOperationTop">
                    <div class="notesOperationTopText"><span class="titleTxt" id="contentTitleID">All Notes</span><span class="subTitleTxt" id="noTopNumber">24 Notes</span></div>
                    <div class="notesOperationTopAction">
                        <select id="sortID" class="category-select btrSelectBtn">
                            <option value="updatedAt">Sort By: Last updated</option>
                            <option value="createdAt">Sort By: Date Created</option>
                            <option value="titleAZ">Sort By: Title a to z</option>
                            <option value="categoryAZ">Sort By: Category a to z</option>
                        </select>
                        <select id="categoryFilter" class="category-select btrSelectBtn">
                            <option value="">All Categories</option>
                        </select>
                        
                    </div>
                </div>
                <div class="notesHolder" id="noteHolder">
                    <template id="noteCardTemplate">
                        <div class="noteSummaryCard">
                            <div class="nscTop"><span class="nscTopEmoji" id="nscTopEmojiID"></span><img class="nscTopPin" src="resources/pin.svg"></div>
                            <div class="nscText">
                                <span class="nscHeading smallerHeading" id="nscHeadingID">Heading</span>
                                <span class="nscDesc smallerTxt" id="nscDescID">Description</span>
                            </div>
                            <div class="nscCatTag"><span class="nscCat catTxt" id="nscCatID">Category</span></div>
                            <div class="nscBot tagTxt">
                                <span class="nscBotDate" id="nscBotDateTime">Date</span>
                                <span class="nscBotNoteIDNo" id="nscBotNoteID"></span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
            <div class="noteDetails">
                <div class="ndTop" id="ndTopID">
                    <img class="nscTopPin pinned" id="ndPinID" src="resources/pin.svg"">
                </div>
                <div class="ndTitle" id="ndTitleID">
                    <span class="ndEmoji" id="ndEmojiID">😊</span><span class="ndtitleTxt titleTxt" id="ndTitleTxtID">TITLE</span>
                </div>
                <div class="ndTitleDateTime"><span class="tagTxt">🗓️</span><span class="ndTopDateTime tagTxt" id="ndTopDateTimeID">Time</span></div>
                <div class="ndCatTag"><span class="ndCat catTxt" id="ndCatID">Category</span><span class="ndTag tagTxt" id="ndTagID">Tag</span></div>
                <div class="ndDesc"><span class="ndDescTxt normalTxt" id="ndDescTxtID">Description</span></div>
                <div class="ndDates tagTxt">
                    <div style="display: flex;"><span>Created: </span><span class="ndCreatedDate" id="ndCreatedDateID"></span></div>
                    <div style="display: flex;"><span>Modified: </span><span class="ndModifiedDate" id="ndModifiedDateID"></span></div>
                </div>
                <div class="ndAction"><button id="ndEditbtnID">Edit</button><button id="ndDeletebtnID">Delete</button> </div>
            </div>

        </div>
        <div class = "content" id="addNoteDivID">
            <p class="titleTxt"> What's in your mind? </p>
            <div class="anInputForm">
                <form id="noteForm" class="note-form">
                    
                    <div class="form-row">
                        <input 
                            type="text" 
                            id="title" 
                            maxlength="100" 
                            placeholder="Note Title (max 100 chars)" 
                            required
                        />
                    </div>

                    <div class="form-row">
                        <textarea 
                            id="content" 
                            maxlength="800" 
                            placeholder="Note Details (max 800 chars)" 
                            required>
                        </textarea>
                    </div>
                    <div class="form-row">
                        <select id="category" required>
                            <option value="">Select Category</option>
                        </select>

                        <input 
                            type="text" 
                            id="tags" 
                            maxlength="50" 
                            placeholder="Tags (max 3, comma separated)" 
                        />
                    </div>
                    <div class="form-row actions">
                        <button type="button" id="cancelBtn">Cancel</button>
                        <button type="submit">Submit</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="content" id="pinnedDivID">
            <div class="pinnedNotesView">
                <span class="titleTxt">Pinned Notes</span>
                <div class="notesHolder" id="noteHolderPinned">
                    <template id="noteCardTemplatePinned">
                        <div class="noteSummaryCard">
                            <div class="nscTop"><span class="nscTopEmoji" id="nscTopEmojiID"></span><img class="nscTopPin pinned" src="resources/pin.svg"></div>
                            <div class="nscText">
                                <span class="nscHeading smallerHeading" id="nscHeadingID">Heading</span>
                                <span class="nscDesc smallerTxt" id="nscDescID">Description</span>
                            </div>
                            <div class="nscCatTag"><span class="nscCat catTxt" id="nscCatID">Category</span></div>
                            <div class="nscBot tagTxt">
                                <span class="nscBotDate" id="nscBotDateTime">Date</span>
                                <span class="nscBotNoteIDNo" id="nscBotNoteID"></span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
        <div class="content" id="categoriesDivID">
            <div class="categoriesContainer">
                <div class="titleTxt">Manage Categories</div>
                <form id="categoryForm" class="categoryForm">
                    <input type="text" id="catEmojiInput" class="catEmojiInput" placeholder="😀" maxlength="2" required />
                    <input type="text" id="catNameInput" class="catNameInput" placeholder="Category" maxlength="20" required />
                    <button type="submit" class="catSubmitBtn">Add</button>
                    <button type="button" id="cancelCatBtn" class="catCancelBtn">Cancel</button>
                </form>
                <div id="categoriesList" class="categoriesList"></div>
            </div>

        </div>
        <div class="content" id="tagsDivID">
            <div class="tagContainer">
                <div class="titleTxt">All Tags</div>
                <div id="tagsList" class="tagsList"></div>
            </div>
        </div>
        <div class="content" id="trashDivID">
            <div class="trashViewDiv">
                <span class="titleTxt">Deleted Notes</span>
                <div class="notesHolder" id="noteHolderTrash">
                    <template id="noteCardTemplateTrash">
                        <div class="noteSummaryCardTrash">
                            <div class="nscTop"><img class="nscTopDLUndo" src="resources/undo.svg"><img class="nscTopPin pinned" src="resources/delete.svg"></div>
                            <div class="nscText">
                                <span class="nscHeading smallerHeading" id="nscHeadingID">Heading</span>
                                <span class="nscDesc smallerTxt" id="nscDescID">Description</span>
                            </div>
                            <div class="nscCatTag"><span class="nscCat catTxt" id="nscCatID">Category</span></div>
                            <div class="nscBot tagTxt">
                                <span class="nscBotDate" id="nscBotDateTime">Date</span>
                                <span class="nscBotNoteIDNo" id="nscBotNoteID"></span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
        <div class="content" id="themeDivID">
            Themes
        </div>






    </div>
    
<script src="tempData.js"></script>
<script src="scripts.js"></script>
</body>
</html>
