<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes Application</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="leftBar">
        <div class="titleDiv">
            <img src="resources/note-book.png" style="width: 3rem; height: 3rem;">
            <div style="display: flex;flex-direction: column;"><span>Notes Application</span><span>Track your notes</span></div>
        </div>
        <div style="display: flex;">
            <button class="buttonWide" id="sidebarAddNoteBtn"> + Add Notes </button>
        </div>
        <div class="menuDiv">
            <nav class="sidebar-menu">
                <button class="menu-item active" id="contentAllMenuID" onclick="showRigtContainer('contentAllID','contentAllMenuID')">
                    <span class="icon">🏠</span>
                    <span class="label">All Notes</span>
                    <span class="count">24</span>
                </button>

                <button class="menu-item" id="pinnedMenuID" onclick="showRigtContainer('pinnedDivID','pinnedMenuID')">
                    <span class="icon">📌</span>
                    <span class="label">Pinned</span>
                    <span class="count">5</span>
                </button>

                <button class="menu-item" id="categoriesMenuID" onclick="showRigtContainer('categoriesDivID','categoriesMenuID')">
                    <span class="icon">📁</span>
                    <span class="label">Categories</span>
                </button>
                
                <button class="menu-item" id="tagsMenuID" onclick="showRigtContainer('tagsDivID','tagsMenuID')">
                    <span class="icon">🏷️</span>
                    <span class="label">Tags</span>
                </button>
                
                <button class="menu-item" id="trashMenuID" onclick="showRigtContainer('trashDivID','trashMenuID')">
                    <span class="icon">🗑️</span>
                    <span class="label">Trash</span>
                </button>

                <button class="menu-item" id="themeMenuID" onclick="showRigtContainer('themeDivID','themeMenuID')">
                    <span class="icon">☾</span>
                    <span class="label">Theme</span>
                </button>
            </nav>
        </div>
        <div class="noteCount">
            <div><span class="icon">📀</span><span class="smallerTxt">Notes Storage</span></div>
            <div>progress bar</div>
            <div><span class="tagTxt">0/100 notes used</span></div>

        </div>
    </div>
    <div class="contents">
        <div class="contentTop">
            <input type="search" class="search-input" id="search-input" style="width: 50rem; height: 2rem;">
            <button class="search-btn" id="search-btn">Search</button>
        </div>
        <div class="content active" id="contentAllID">
            <div class="notesOperation" >
                <div class="notesOperationTop">
                    <div class="notesOperationTopText"><span>All Notes</span><span>24 Notes</span></div>
                    <div class="notesOperationTopAction"><span>Filter</span><span>sort</span></div>
                </div>
                <div class="notesHolder" id="noteHolder">
                    <template id="noteCardTemplate">
                        <div class="noteSummaryCard">
                            <div class="nscTop"><span class="nscTopEmoji" id="nscTopEmojiID"></span><img src="resources/note-book.png"></div>
                            <div class="nscText">
                                <span class="nscHeading smallerHeading" id="nscHeadingID">Heading</span>
                                <span class="nscDesc smallerTxt" id="nscDescID">Description</span>
                            </div>
                            <div class="nscCatTag"><span class="nscCat catTxt" id="nscCatID">Category</span></div>
                            <div class="nscBot tagTxt"><span class="nscBotDate" id="nscBotDateTime">Date</span></div>
                        </div>
                    </template>
                </div>
            </div>
            <div class="noteDetails">
                <div class="ndTop" id="ndTopID">
                    <img src="resources/note-book.png"><img src="resources/note-book.png">
                </div>
                <div class="ndTitle" id="ndTitleID">
                    <span class="ndEmoji" id="ndEmojiID">😊</span><span class="ndtitleTxt titleTxt" id="ndTitleTxtID">TITLE</span>
                </div>
                <div class="ndTitleDateTime"><span class="tagTxt">🗓️</span><span class="ndTopDateTime tagTxt" id="ndTopDateTimeID">Time</span></div>
                <div class="ndCatTag"><span class="ndCat catTxt" id="ndCatID">Category</span><span class="ndTag tagTxt" id="ndTagID">Tag</span></div>
                <div class="ndDesc"><span class="ndDescTxt normalTxt" id="ndDescTxtID">Description</span></div>
                <div class="ndDates tagTxt">
                    <div style="display: flex;"><span>Created: </span><span class="ndCreatedDate" id="ndCreatedDateID"></span></div>
                    <div style="display: flex;"><span>Modified: </span><span class="ndModifiedDate" id="ndModifiedDateID"></span></div>
                </div>
                <div class="ndAction"><button>Edit</button><button>Delete</button> </div>
            </div>

        </div>
        <div class = "content" id="addNoteDivID">
            <p class="titleTxt"> What's in your mind? </p>
            <div class="anInputForm">
                <form id="noteForm" class="note-form">
                    
                    <div class="form-row">
                        <input 
                            type="text" 
                            id="title" 
                            maxlength="100" 
                            placeholder="Note Title (max 100 chars)" 
                            required
                        />
                    </div>

                    <div class="form-row">
                        <textarea 
                            id="content" 
                            maxlength="800" 
                            placeholder="Note Details (max 800 chars)" 
                            required>
                        </textarea>
                    </div>
                    <div class="form-row">
                        <select id="category" required>
                            <option value="">Select Category</option>
                        </select>

                        <input 
                            type="text" 
                            id="tags" 
                            maxlength="50" 
                            placeholder="Tags (max 3, comma separated)" 
                        />
                    </div>
                    <div class="form-row actions">
                        <button type="button" id="cancelBtn">Cancel</button>
                        <button type="submit">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="content" id="pinnedDivID">
        Pined Div
    </div>
    <div class="content" id="categoriesDivID">
        Categories
    </div>
    <div class="content" id="tagsDivID">
        Tags
    </div>
    <div class="content" id="trashDivID">
        Trash
    </div>
    <div class="content" id="themeDivID">
        Themes
    </div>
<script src="tempData.js"></script>
<script src="scripts.js"></script>
</body>
</html>
