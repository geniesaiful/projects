<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Application</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="homePage active" id="homePage">
        <div class="leftBar">
            <img src="resources/banner1.jpg">
        </div>
        <div class="rightContent">
            <div class="rContentDiv">
                <h1 class="title">Take a simple quiz!</h1>
                <p class="subtitle">5 questions 1 minutes</p>
            </div>
            <div class="rContentDiv">
                <div class="hpContentDiv">
                    <div class="hpImgContainer">
                        <img src="resources/alien-svgrepo-com.svg" style="height: 48px; width: 48px;">
                    </div>
                    <div class="hpTextContainer">
                        <p class="hpText">Multiple choice question</p>
                        <p class="hpSubText">Choose the correct answer</p>
                    </div>
                </div>
                <div class="hpContentDiv">
                    <div class="hpImgContainer">
                        <img src="resources/alien-svgrepo-com.svg" style="height: 48px; width: 48px;">
                    </div>
                    <div class="hpTextContainer">
                        <p class="hpText">Multiple choice question</p>
                        <p class="hpSubText">Choose the correct answer</p>
                    </div>
                </div>
                <div class="hpContentDiv">
                    <div class="hpImgContainer">
                        <img src="resources/alien-svgrepo-com.svg" style="height: 48px; width: 48px;">
                    </div>
                    <div class="hpTextContainer">
                        <p class="hpText">Multiple choice question</p>
                        <p class="hpSubText">Choose the correct answer</p>
                    </div>
                </div>
            </div>
            <div class="rContentDiv" style="display:flex; align-items: center; justify-content: center;">
                <button class="hpButton">Start Quiz</button>
            </div>
        </div>
    </div>

    <div class="quizDiv" id="quizPage">
        <div class="quizTop">
            <p class="text">question 1 of 5</p>
            <div style="display: flex; flex-direction: row;">
                <img src="resources/timer-error-svgrepo-com.svg" style="height: 26px; width: 26px; margin: 10px 4px;"><p class="text">time</p>
            </div>
            <p class="text">score</p>
        </div>
        <div class="quizBody" style="background-color: rgb(177, 173, 168);">
            
            <div>
                <p class="question-text">Who is the father of Thor?</p>
            </div>
            <div>
                <button class="option-btn" id="opt0" onclick="selectOption(0)">Option 1</button>
            </div>
            <div>
                Buttons
            </div>
        </div>
    </div>

    <div class="reviewDiv" id="reviewPage">

    </div>

    <div class="scoreDiv" id="scorePage">

    </div>



<script src="scripts.js"></script>
</body>
</html>
